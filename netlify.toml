[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /whitepaper is the URL listing reviewers (CMC, CoinGecko, PolygonScan, OJK)
# probe by convention; the document itself lives on the docs site. 302 on
# purpose: the target moves once the final whitepaper artifact exists — a 301
# would let browsers and aggregators cache the docs site forever.
[[redirects]]
  from = "/whitepaper"
  to = "https://docs.usdx.co.id"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # connect-src also lists the public API: /transparency fetches
    # {API_BASE}/api/v1/public/transparency from the browser (see
    # src/data/transparency.ts). Without these the page would silently fall back
    # to its baked-in figures on every load.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://app.usdxcoin.xyz https://app.usdx.co.id https://api.usdx.co.id https://api-dev.usdx.co.id; frame-ancestors 'none';"
